# Nombre del mundo del Reino Perdido. Tiene que coincidir con el que crees
# (con /reino crear o con /mv create).
mundo: reino_perdido

# Semilla del mundo al crearlo con /reino crear (0 = aleatoria).
semilla: 0

# Radio del borde del mundo, en bloques (el mundo mide el doble).
bordeMundo: 1200

# Si es true, el plugin carga el mundo solo al iniciar el server
# (si Multiverse no lo cargó antes).
autoCargar: true

# Si es true, no spawnean animales (queda un mundo mas hostil).
bloquearAnimales: true

jefe:
  vida: 900
  # Minutos que tarda en reaparecer despues de que lo matan.
  minutosRespawn: 45

# Skin de Florencia, la jefa (opcional, requiere LibsDisguises + PacketEvents instalados).
# Subi la skin a https://mineskin.org (modelo "Slim"/Alex para una skin de mujer) y pega aca
# los dos campos "value" y "signature" que te da. Si lo dejas vacio, Florencia se ve como Evoker.
skinFlorencia:
  nombre: Florencia
  value: ''
  signature: ''

# Efectos para que la dimension se sienta viva.
ambiente:
  efectos: true   # particulas y sonidos ambientales
  titulos: true   # titulo al entrar a la dimension y a cada zona de la ciudadela
